<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Social Care Career & Qualification Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Health & Social Care Career & Qualification Finder</h1>

    <p>
        Find the right health and social care qualification for your career goals.
    </p>
    <div class="question">
    <h2>What is your current qualification level?</h2>

    <button onclick="selectQualification('new')">I'm new to health & social care</button>
<button onclick="selectQualification('level2')">Level 2</button>
<button onclick="selectQualification('level3')">Level 3</button>
<button onclick="selectQualification('level4')">Level 4</button>
<button onclick="selectQualification('level5')">Level 5</button>
</div>
<div class="question">
    <h2>What is your main career goal?</h2>

    <button onclick="selectCareerGoal('Start a career in care')">
        Start a career in care
    </button>

    <button onclick="selectCareerGoal('Become a senior care worker')">
        Become a senior care worker
    </button>

    <button onclick="selectCareerGoal('Move into care management')">
        Move into care management
    </button>

    <button onclick="selectCareerGoal('Develop my existing skills')">
        Develop my existing skills
    </button>

    <button onclick="selectCareerGoal('Progress to a higher qualification')">
        Progress to a higher qualification
    </button>
</div>
    <div class="question">
    <h2>What type of care are you interested in?</h2>

    <button>Adult social care</button>
    <button>Health and social care</button>
    <button>Care management</button>
    <button>Children and young people</button>
    <button>Not sure yet</button>
</div>
    
<script src="script.js"></script>
    
</body>
</html>
